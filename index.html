<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tripsync</title>
<meta name="theme-color" content="#14233a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tripsync">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="topo">
    <h1>Tripsync</h1>
    <button type="button" id="btnPerfil" class="avatar-btn" hidden aria-label="Meu perfil"></button>
  </header>

  <!-- Entrar / criar conta -->
  <section id="tela-login" hidden>
    <div class="cartao login">
      <h2 id="loginTitulo">Entrar</h2>
      <p class="sub">Escapadas nos feriados, combinadas com seus amigos.</p>
      <form id="formLogin" class="form">
        <label for="lEmail">E-mail</label>
        <input type="email" id="lEmail" required autocomplete="email">
        <label for="lSenha">Senha</label>
        <input type="password" id="lSenha" required minlength="8" autocomplete="current-password">
        <div id="campoNome" hidden><label for="lNome">Seu nome</label><input type="text" id="lNome" autocomplete="name"></div>
        <button class="ir" type="submit" id="lBotao">Entrar</button>
        <p class="msg" id="lMsg" role="status"></p>
      </form>
      <div class="acoes">
        <button type="button" class="leve" id="trocaModo">Ainda não tenho conta</button>
        <button type="button" class="leve" id="esqueci">Esqueci a senha</button>
      </div>
    </div>
  </section>

  <!-- App -->
  <section id="tela-app" hidden>
    <nav class="abas" aria-label="Seções">
      <a href="#escapadas" data-aba="escapadas">Escapadas</a>
      <a href="#jafui" data-aba="jafui">Já fui</a>
      <a href="#grupos" data-aba="grupos">Amigos</a>
      <a href="#perfil" data-aba="perfil">Perfil</a>
    </nav>
    <p class="msg" id="appMsg" role="status"></p>

    <div id="aba-escapadas" class="aba">
      <div class="topo2">
        <div class="saldo"><b id="restam">23</b><span id="saldoTxt">dias livres</span></div>
        <div class="pill" id="anos" role="group" aria-label="Ano"></div>
      </div>
      <div id="lista" class="lista"></div>
    </div>

    <div id="aba-jafui" class="aba" hidden>
      <div class="cartao">
        <div class="numeros"><div><b id="nPaises">0</b><span>países</span></div><div><b id="nPct">0%</b><span>do mundo</span></div><div><b id="nCidades">0</b><span>cidades</span></div></div>
        <div class="mapa-box"><svg id="mapa" role="img" aria-label="Mapa-múndi com os países visitados"></svg></div>
      </div>
      <div class="cartao">
        <h3 id="tituloLista">Onde você já foi?</h3>
        <input type="text" id="buscaPais" placeholder="Buscar país" autocomplete="off" aria-label="Buscar país">
        <ul class="limpa lista-paises" id="listaPaises"></ul>
      </div>
    </div>

    <div id="aba-grupos" class="aba" hidden>
      <div class="cartao">
        <h3>Seus grupos</h3>
        <div id="meusGrupos"></div>
        <form id="formCriarGrupo" class="linha-form"><input type="text" id="gNome" placeholder="Nome do grupo (ex.: Galera de Bruxelas)" required aria-label="Nome do grupo"><button class="ir" type="submit">Criar</button></form>
        <form id="formEntrarGrupo" class="linha-form"><input type="text" id="gCodigo" placeholder="Código de convite" required maxlength="6" aria-label="Código de convite" style="text-transform:uppercase"><button class="ir" type="submit">Entrar</button></form>
      </div>
      <div id="grupoDetalhe"></div>
    </div>

    <div id="aba-perfil" class="aba" hidden>
      <form class="cartao form" id="formPerfil">
        <div class="foto-linha">
          <div class="foto" id="fotoPrev"></div>
          <label class="leve" for="pFoto" style="cursor:pointer">Trocar foto</label>
          <input type="file" id="pFoto" accept="image/jpeg,image/png,image/webp" hidden>
        </div>
        <label for="pNome">Nome</label><input type="text" id="pNome" autocomplete="name">
        <label for="pTel">Telefone</label><input type="tel" id="pTel" autocomplete="tel" placeholder="+32 4xx xx xx xx">
        <label for="pNasc">Data de nascimento</label><input type="date" id="pNasc">
        <label for="pCidade">Cidade de onde você sai</label><input type="text" id="pCidade" placeholder="Bruxelas">
        <label for="pDias">Dias de férias por ano</label><input type="number" id="pDias" min="0" max="60">
        <button class="ir" type="submit">Salvar perfil</button>
        <p class="msg" id="pMsg" role="status"></p>
      </form>
      <div class="acoes"><span class="sub" id="pEmail"></span><button type="button" class="leve" id="sair">Sair</button></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="mapa.js"></script>
<script src="core.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
