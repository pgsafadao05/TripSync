<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tripsync</title>
<meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon2.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon2-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tripsync">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
<!-- Travelpayouts Drive: transforma links de viagem (voos, hotéis) em links de afiliado do Pedro -->
<script data-cmp-ab="2">
  (function () {
    var script = document.createElement("script");
    script.async = 1;
    script.setAttribute("data-cmp-ab", "2");
    script.src = 'https://emrld.ltd/NTk0MzY2.js?t=594366';
    document.head.appendChild(script);
  })();
</script>
</head>
<body>
<!-- Abertura: os dois trajetos se encontram no destino (some sozinha em ~2s; toque pula) -->
<div class="abertura" id="abertura" aria-hidden="true">
  <div class="abertura-in">
    <svg viewBox="0 0 64 64" fill="none"><path class="r1" d="M6 40 C 16 22, 32 15, 46 16"/><path class="r2" d="M22 58 C 26 40, 36 24, 46 16"/>
      <g class="pino"><circle cx="47" cy="16" r="8" fill="#16181d"/><circle cx="47" cy="16" r="3" fill="#fff4ec"/></g></svg>
    <div class="nome">Trip<i>sync</i></div>
  </div>
</div>
<script>
  (function () { // só na primeira abertura da sessão
    var a = document.getElementById('abertura'), visto = false;
    try { visto = sessionStorage.getItem('tripsync:abertura') === '1'; sessionStorage.setItem('tripsync:abertura', '1'); } catch (e) {}
    if (visto) { a.remove(); return; }
    var fim = function () { a.classList.add('sai'); setTimeout(function () { a.remove(); }, 500); };
    a.addEventListener('click', fim); setTimeout(fim, 2100);
  })();
</script>
<div class="wrap">
  <header class="topo">
    <div class="marca-app"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#e8553a"/><g transform="translate(6 6) scale(.81)"><path d="M6 40 C 16 22, 32 15, 46 16" stroke="#fff4ec" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.5 8"/><path d="M22 58 C 26 40, 36 24, 46 16" stroke="#fff4ec" stroke-width="4.5" stroke-linecap="round"/><circle cx="47" cy="16" r="8" fill="#16181d"/><circle cx="47" cy="16" r="3" fill="#fff4ec"/></g></svg><h1>Trip<i>sync</i></h1></div>
    <div class="topo-dir">
      <select id="idiomaTopo" class="idioma" data-i18n-aria="idioma"></select>
      <button type="button" id="btnPerfil" class="avatar-btn" hidden data-i18n-aria="aria.perfil"></button>
    </div>
  </header>

  <!-- Entrar / criar conta -->
  <section id="tela-login" hidden>
    <div class="cartao login">
      <h2 id="loginTitulo"></h2>
      <p class="sub" data-i18n="app.sub"></p>
      <form id="formLogin" class="form">
        <label for="lEmail" data-i18n="email"></label>
        <input type="email" id="lEmail" required autocomplete="email">
        <label for="lSenha" data-i18n="senha"></label>
        <input type="password" id="lSenha" required minlength="8" autocomplete="current-password">
        <button class="ir" type="submit" id="lBotao"></button>
        <p class="msg" id="lMsg" role="status"></p>
      </form>
      <div class="acoes">
        <button type="button" class="leve" id="trocaModo"></button>
        <button type="button" class="leve" id="esqueci" data-i18n="esqueci"></button>
      </div>
    </div>
  </section>

  <!-- Cadastro (primeira vez) -->
  <section id="tela-cadastro" hidden>
    <form class="cartao login form" id="formCadastro">
      <p class="rotulo" data-i18n="cad.passo1"></p>
      <h2 data-i18n="cad.titulo"></h2>
      <p class="sub" data-i18n="cad.sub"></p>
      <div class="dupla">
        <div class="form"><label for="cNome" data-i18n="nome"></label><input type="text" id="cNome" required autocomplete="given-name"></div>
        <div class="form"><label for="cSobrenome" data-i18n="sobrenome"></label><input type="text" id="cSobrenome" required autocomplete="family-name"></div>
      </div>
      <label for="cNasc" data-i18n="nasc"></label><input type="date" id="cNasc" required>
      <label for="cPais" data-i18n="pais"></label><select id="cPais" required></select>
      <span class="sub" data-i18n="cad.paisDica"></span>
      <label for="cCidade" data-i18n="cidade"></label><input type="text" id="cCidade" required data-i18n-ph="cidade.ph" autocomplete="address-level2">
      <label for="cDias" data-i18n="dias"></label><input type="number" id="cDias" required min="0" max="60" inputmode="numeric" data-i18n-ph="dias.ph">
      <span class="sub" data-i18n="cad.diasDica"></span>
      <label for="cTel"><span data-i18n="telefone"></span> <span class="sub" data-i18n="opcional"></span></label><input type="tel" id="cTel" autocomplete="tel">
      <button class="ir" type="submit" data-i18n="continuar"></button>
      <p class="msg" id="cMsg" role="status"></p>
    </form>
    <div class="cartao login form" id="passoPaises" hidden>
      <p class="rotulo" data-i18n="cad.passo2"></p>
      <h2 data-i18n="cad.titulo2"></h2>
      <p class="sub" data-i18n="cad.sub2"></p>
      <div class="mapa-box"><svg id="mapaCad" role="img" data-i18n-aria="aria.mapa"></svg></div>
      <p class="sub"><b id="nCad">0</b> <span data-i18n="cad.marcados"></span></p>
      <input type="text" id="buscaCad" data-i18n-ph="buscaPais" autocomplete="off" data-i18n-aria="buscaPais">
      <div class="chips grade-paises" id="listaCad"></div>
      <div class="acoes"><button type="button" class="leve" id="voltarCad" data-i18n="voltar"></button><button type="button" class="ir" id="fimCad" data-i18n="cad.fim"></button></div>
      <p class="msg" id="cMsg2" role="status"></p>
    </div>
  </section>

  <!-- App -->
  <section id="tela-app" hidden>
    <nav class="abas" data-i18n-aria="aria.secoes">
      <a href="#escapadas" data-aba="escapadas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18"/><path d="M5 17c1.5-6 6-10 14-10"/><circle cx="19" cy="7" r="2"/></svg><span data-i18n="aba.escapadas"></span></a>
      <a href="#viagens" data-aba="viagens"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14.5h3"/></svg><span data-i18n="aba.viagens"></span></a>
      <a href="#jafui" data-aba="jafui"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.6 5.4 3.6 8.5s-1.1 5.9-3.6 8.5c-2.5-2.6-3.6-5.4-3.6-8.5S9.5 6.1 12 3.5z"/></svg><span data-i18n="aba.jafui"></span></a>
      <a href="#grupos" data-aba="grupos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="16.5" cy="8" r="2.6"/><path d="M15.5 13.2c2.6-.3 4.6 1.3 5 4.3"/></svg><span data-i18n="aba.amigos"></span></a>
      <a href="#perfil" data-aba="perfil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.8 3.6-6 7-6s6.2 2.2 7 6"/></svg><span data-i18n="aba.perfil"></span></a>
    </nav>
    <p class="msg" id="appMsg" role="status"></p>
    <div id="perguntaCompra" class="cartao pergunta" hidden></div>

    <div id="aba-escapadas" class="aba">
      <div class="topo2">
        <div class="saldo"><b id="restam"></b><span id="saldoTxt"></span></div>
        <div class="pill" id="anos" role="group" data-i18n-aria="aria.ano"></div>
      </div>
      <div id="lista" class="lista"></div>
    </div>

    <div id="aba-viagens" class="aba" hidden>
      <div class="cartao" id="vResumo"></div>
      <div class="cartao">
        <div class="topo2"><h3 id="vCalTitulo"></h3><div class="pill" id="vAnos" role="group" data-i18n-aria="aria.ano"></div></div>
        <div class="legenda"><span><i class="lg viagem"></i><span data-i18n="legenda.viagem"></span></span><span><i class="lg folga"></i><span data-i18n="legenda.folga"></span></span><span><i class="lg feriado"></i><span data-i18n="legenda.feriado"></span></span></div>
        <div class="cal" id="vCal"></div>
      </div>
      <div id="vLista" class="lista-viagens"></div>
    </div>

    <div id="aba-jafui" class="aba" hidden>
      <div class="cartao">
        <div class="numeros"><div><b id="nPaises">0</b><span data-i18n="paises"></span></div><div><b id="nPct">0%</b><span data-i18n="doMundo"></span></div><div><b id="nCidades">0</b><span data-i18n="cidades"></span></div></div>
        <div class="mapa-box"><svg id="mapa" role="img" data-i18n-aria="aria.mapa"></svg></div>
      </div>
      <div class="cartao">
        <h3 id="tituloLista"></h3>
        <input type="text" id="buscaPais" data-i18n-ph="buscaPais" autocomplete="off" data-i18n-aria="buscaPais">
        <ul class="limpa lista-paises" id="listaPaises"></ul>
      </div>
    </div>

    <div id="aba-grupos" class="aba" hidden>
      <div class="cartao">
        <h3 data-i18n="seusGrupos"></h3>
        <div id="meusGrupos"></div>
        <form id="formCriarGrupo" class="linha-form"><input type="text" id="gNome" data-i18n-ph="grupo.ph" required data-i18n-aria="aria.grupo"><button class="ir" type="submit" data-i18n="criar"></button></form>
        <form id="formEntrarGrupo" class="linha-form"><input type="text" id="gCodigo" data-i18n-ph="codigo.ph" required maxlength="6" data-i18n-aria="codigo.ph" style="text-transform:uppercase"><button class="ir" type="submit" data-i18n="entrar"></button></form>
      </div>
      <div id="grupoDetalhe"></div>
    </div>

    <div id="aba-perfil" class="aba" hidden>
      <form class="cartao form" id="formPerfil">
        <div class="foto-linha">
          <div class="foto" id="fotoPrev"></div>
          <label class="leve" for="pFoto" style="cursor:pointer" data-i18n="trocarFoto"></label>
          <input type="file" id="pFoto" accept="image/jpeg,image/png,image/webp" hidden>
        </div>
        <div class="dupla">
          <div class="form"><label for="pNome" data-i18n="nome"></label><input type="text" id="pNome" autocomplete="given-name"></div>
          <div class="form"><label for="pSobrenome" data-i18n="sobrenome"></label><input type="text" id="pSobrenome" autocomplete="family-name"></div>
        </div>
        <label for="pTel" data-i18n="telefone"></label><input type="tel" id="pTel" autocomplete="tel" placeholder="+32 4xx xx xx xx">
        <label for="pNasc" data-i18n="nasc"></label><input type="date" id="pNasc">
        <label for="pPais" data-i18n="pais"></label><select id="pPais"></select>
        <label for="pCidade" data-i18n="cidadeSai"></label><input type="text" id="pCidade" data-i18n-ph="cidade.ph">
        <label for="pDias" data-i18n="dias"></label><input type="number" id="pDias" min="0" max="60">
        <label for="pIdioma" data-i18n="idioma"></label><select id="pIdioma"></select>
        <button class="ir" type="submit" data-i18n="salvarPerfil"></button>
        <p class="msg" id="pMsg" role="status"></p>
      </form>
      <div class="acoes"><span class="sub" id="pEmail"></span><button type="button" class="leve" id="sair" data-i18n="sair"></button></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="i18n.js"></script>
<script src="mapa.js"></script>
<script src="core.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
